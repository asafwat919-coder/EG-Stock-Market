# XcodeGen spec. The .xcodeproj is generated from this file (on CI or on a Mac
# with `brew install xcodegen && xcodegen`), so nobody has to edit project files by hand.
name: EGXTrader
options:
  bundleIdPrefix: com.niletrader
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EGXTrader:
    type: application
    platform: iOS
    sources:
      - path: EGXTrader
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Nile Trader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Nile Trader uses Face ID to confirm orders.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niletrader.app
        PRODUCT_NAME: EGXTrader
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: true
  EGXTraderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EGXTraderTests
    dependencies:
      - target: EGXTrader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.niletrader.app.tests
schemes:
  EGXTrader:
    build:
      targets:
        EGXTrader: all
        EGXTraderTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - EGXTraderTests
